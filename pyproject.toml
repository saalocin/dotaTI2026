[project]
name = "ti2026"
version = "0.1.0"
description = "TI 2026 predictions & fantasy data pipeline (medallion: bronze/silver/gold)"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "mwparserfromhell>=0.6.6",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "numpy>=2.0",
    "pandas>=2.2",
    "pillow>=10.0",
    "tenacity>=9.0",
    "vpk>=1.4.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
ti = "ti2026.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ti2026"]

[tool.pytest.ini_options]
testpaths = ["tests"]
